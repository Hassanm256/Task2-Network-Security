apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5432  # Fixed from 6379 to proper PostgreSQL port
  egress:  # CRITICAL FIX: Add egress for DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
