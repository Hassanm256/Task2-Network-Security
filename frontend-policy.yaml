apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-frontend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []  # CRITICAL FIX: Allow external traffic
    ports:
    - protocol: TCP
      port: 80
  egress:  # CRITICAL FIX: Add egress rules
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 80
  - to: {}  # Allow DNS
    ports:
    - protocol: UDP
      port: 53
